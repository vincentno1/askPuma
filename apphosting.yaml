# Firebase App Hosting runtime configuration; live deployment documented in docs/DELIVERY.md.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 8
  cpu: 1
  memoryMiB: 1024

env:
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  - variable: GOOGLE_CLOUD_PROJECT
    value: askpuma-prod
    availability:
      - RUNTIME
  - variable: OPENAI_MODEL
    value: gpt-6-astra
    availability:
      - RUNTIME
